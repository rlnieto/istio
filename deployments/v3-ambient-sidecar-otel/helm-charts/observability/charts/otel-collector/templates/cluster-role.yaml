# Rol con permisos de escritura
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempostack-traces-write
rules:
  - apiGroups:
      - 'tempo.grafana.com'
    # Lista de los tenants
    resources:
      - bookinfo-sidecar
      - bookinfo-ambient
    resourceNames:
      - traces
    verbs:
      - 'create'